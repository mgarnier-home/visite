# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  build:back:
    dir: ./backend
    vars:
      VERSION: '{{default "v0.0.0" .VERSION}}'
      COMMIT: '{{default "commitsha" .COMMIT}}'
      DATE: '{{default "undefined" .DATE}}'
    cmds:
      - go build -ldflags="-X 'github.com/mgarnier-home/utils/buildinfo.Version={{.VERSION}}' -X 'github.com/mgarnier-home/utils/buildinfo.Commit={{.COMMIT}}' -X 'github.com/mgarnier-home/utils/buildinfo.Date={{.DATE}}'" -o ../bin/visite .
  build:front:
    cmds:
      - |
        if [ ! -d frontend ]; then
          echo "frontend/ absent : build du front ignoré"
          exit 0
        fi
        cd frontend
        [ -d node_modules ] || npm ci
        npx ng build
        cd ..
        find backend/web/dist -mindepth 1 ! -name .gitkeep -delete
        cp -r frontend/dist/frontend/browser/. backend/web/dist/
  build:
    cmds:
      - task: build:front
      - task: build:back
  run:
    deps: [build]
    cmds:
      - mkdir -p data/photos
      - VISITE_DB_PATH="$PWD/data/visite.db" VISITE_PHOTOS_DIR="$PWD/data/photos" ./bin/visite
  test:
    dir: ./backend
    cmds:
      - go test ./...
  front:dev:
    dir: ./frontend
    cmds:
      - npx ng serve --proxy-config proxy.conf.json
  front:test:
    dir: ./frontend
    cmds:
      - npx ng test --watch=false
  e2e:
    cmds:
      - task: build
      - cd frontend && npx playwright test
  docker:build:
    cmds:
      - docker --context default buildx build --builder default --platform linux/amd64 --load -t visite:dev .
